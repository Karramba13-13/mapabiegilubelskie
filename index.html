<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna Mapa Biegów - Lubelskie Październik 2026</title>
    
    <!-- Biblioteka Leaflet (Stylizacja mapy) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { font-size: 22px; margin-bottom: 5px; }
        header p { font-size: 13px; opacity: 0.9; }
        
        .container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 75px);
        }
        
        .sidebar {
            width: 350px;
            background: white;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .scrollable-content {
            overflow-y: auto;
            flex: 1;
        }
        .sidebar h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #1e3c72;
            border-bottom: 2px solid #2a5298;
            padding-bottom: 5px;
        }
        .run-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .run-item:hover {
            background: #f0f4f8;
        }
        .run-item strong { color: #2a5298; }
        .date-badge {
            background: #e67e22;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        /* Sekcja reklamowa na dole panelu */
        .ad-box {
            background: #f9f9f9;
            border: 2px dashed #ccc;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 15px;
        }

        /* Wygląd okienka Popup po najechaniu */
        .popup-info h3 {
            margin-bottom: 6px;
            color: #1e3c72;
            font-size: 14px;
        }
        .popup-info p {
            margin: 3px 0;
            font-size: 12px;
            color: #555;
        }
        .popup-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏃‍♂️ Kalendarz Biegowy - Województwo Lubelskie</h1>
        <p>Interaktywna mapa biegów i wydarzeń sportowych – Październik 2026</p>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="scrollable-content">
                <h2>🗓️ Lista Wydarzeń (Październik 2026)</h2>
                <div id="events-list"></div>
            </div>
            
            <!-- Przestrzeń pod reklamy (np. Google AdSense) -->
            <div class="ad-box">
                <p>📢 <strong>Miejsce na Twoją Reklamę</strong></p>
                <p style="font-size: 11px; color:#aaa; margin-top:4px;">Kontakt: reklama@twojadomena.pl</p>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <!-- Biblioteka Leaflet JS wrzucona na koniec dla poprawnego ładowania -->
    <script src="https://unpkg.com"></script>
    <script>
        // Skrypt uruchomi się dopiero po pełnym załadowaniu struktury HTML
        window.onload = function() {
            const runData = [
                { id: 1, name: "Ogólnopolskie Biegi Uliczne Pamięci Gen. Kleeberga", city: "Kock", coords: [51.6394, 22.4439], date: "03.10.2026", dist: "Uliczny / Patriotyczny" },
                { id: 2, name: "Duathlon Olimpijski", city: "Adamów", coords: [51.7472, 22.2514], date: "03.10.2026", dist: "Bieg + Rower" },
                { id: 3, name: "XXV Bieg Sobiborski", city: "Włodawa", coords: [51.5458, 23.5512], date: "10.10.2026", dist: "21,1 km (Półmaraton)" },
                { id: 4, name: "Botaniczna Piątka – Edycja Jesienna", city: "Lublin", coords: [51.2640, 22.5130], date: "11.10.2026", dist: "5 km (Ogród Botaniczny)" },
                { id: 5, name: "Listtowie – Siódemka w Hrubieszowie", city: "Hrubieszów", coords: [50.8049, 23.8916], date: "11.10.2026", dist: "7 km (Uliczny)" },
                { id: 6, name: "STOKROTKA 10. Półmaraton Lubelski", city: "Lublin", coords: [51.2415, 22.5690], date: "18.10.2026", dist: "21,0975 km (Uliczny)" },
                { id: 7, name: "Biegam, bo lubię lasy", city: "Lubartów", coords: [51.4622, 22.6074], date: "Październik 2026", dist: "10 km (Trail leśny)" }
            ];

            const map = L.map('map').setView([51.2465, 22.5622], 9);

            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            const sidebarList = document.getElementById('events-list');

            runData.forEach(run => {
                const item = document.createElement('div');
                item.className = 'run-item';
                item.innerHTML = `
                    <span class="date-badge">${run.date.substring(0,5)}</span> <strong>${run.name}</strong><br>
                    📍 ${run.city} | ${run.dist}
                `;
                sidebarList.appendChild(item);

                const popupContent = `
                    <div class="popup-info">
                        <h3>${run.name}</h3>
                        <p><strong>Miejscowość:</strong> ${run.city}</p>
                        <p><strong>Data:</strong> ${run.date}</p>
                        <span class="popup-badge">${run.dist}</span>
                    </div>
                `;

                const marker = L.marker(run.coords).addTo(map).bindPopup(popupContent);

                marker.on('mouseover', function () {
                    this.openPopup();
                });

                item.addEventListener('click', () => {
                    map.setView(run.coords, 12);
                    marker.openPopup();
                });
            });
        };
    </script>
</body>
</html>
