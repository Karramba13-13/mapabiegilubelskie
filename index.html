<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #17202a;
}

/* =========================
   NAGŁÓWEK
========================= */

header {
  background: linear-gradient(135deg, #0f766e, #16a085);
  color: white;
  padding: 22px 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

header h1 {
  margin: 0 0 6px;
  font-size: 27px;
}

header p {
  margin: 0;
  opacity: .92;
}

/* =========================
   FILTRY
========================= */

.toolbar {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: white;
  padding: 12px;

  box-shadow: 0 2px 10px rgba(0,0,0,.08);

  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.toolbar select,
.toolbar input,
.toolbar button {
  border: 1px solid #d5dadd;
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 14px;
  background: white;
}

.toolbar input {
  min-width: 220px;
  flex: 1;
}

.toolbar button {
  cursor: pointer;
  font-weight: bold;
}

.toolbar button:hover {
  background: #eef7f6;
}

/* =========================
   UKŁAD
========================= */

.layout {
  display: grid;
  grid-template-columns: 430px 1fr;

  height: calc(100vh - 145px);
  min-height: 650px;
}

/* =========================
   LISTA
========================= */

.sidebar {
  background: #fff;
  overflow-y: auto;

  border-right: 1px solid #ddd;

  padding: 14px;
}

.summary {
  padding: 8px 4px 14px;

  color: #5d6870;

  font-size: 14px;
}

/* =========================
   KARTA BIEGU
========================= */

.event {
  background: white;

  border: 1px solid #e0e5e8;
  border-left: 5px solid #16a085;

  border-radius: 11px;

  margin-bottom: 10px;
  padding: 13px;

  cursor: pointer;

  transition: .15s;

  box-shadow: 0 2px 5px rgba(0,0,0,.04);
}

.event:hover {
  transform: translateY(-1px);

  box-shadow:
    0 5px 13px rgba(0,0,0,.09);
}

.event.active {
  border-left-color: #0b5d56;

  background: #f0faf8;

  box-shadow:
    0 0 0 2px rgba(22,160,133,.18);
}

.event-date {
  color: #16a085;

  font-size: 13px;
  font-weight: bold;

  margin-bottom: 4px;
}

.event-name {
  font-weight: 700;

  font-size: 16px;

  line-height: 1.25;

  margin-bottom: 6px;
}

.event-location {
  font-size: 13px;

  color: #66727a;

  margin-bottom: 8px;
}

.event-description {
  font-size: 13px;

  line-height: 1.45;

  color: #39434a;
}

.badge {
  display: inline-block;

  background: #e8f6f3;

  color: #117864;

  border-radius: 20px;

  padding: 4px 8px;

  font-size: 11px;

  margin-top: 8px;
}

/* =========================
   MAPA
========================= */

#map {
  width: 100%;
  height: 100%;
}

/* =========================
   POPUP
========================= */

.popup-title {
  font-size: 16px;

  font-weight: bold;

  margin-bottom: 6px;
}

.popup-date {
  color: #117864;

  font-weight: bold;

  margin-bottom: 6px;
}

.popup-description {
  line-height: 1.4;

  margin-top: 8px;

  max-width: 300px;
}

/* =========================
   LEGENDA
========================= */

.legend {
  position: fixed;

  right: 15px;
  bottom: 15px;

  z-index: 999;

  background: white;

  border-radius: 9px;

  padding: 10px 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.18);

  font-size: 12px;
}

.legend-dot {
  display: inline-block;

  width: 10px;
  height: 10px;

  background: #16a085;

  border-radius: 50%;

  margin-right: 5px;
}

/* =========================
   MARKER DLA WIELU BIEGÓW
========================= */

.multi-marker {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  background: #16a085;

  border: 3px solid white;

  box-shadow:
    0 2px 8px rgba(0,0,0,.35);

  display: flex;

  align-items: center;
  justify-content: center;

  color: white;

  font-size: 13px;

  font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

  .layout {
    grid-template-columns: 1fr;

    height: auto;
  }

  .sidebar {
    height: 55vh;

    border-right: 0;

    border-bottom: 1px solid #ddd;
  }

  #map {
    height: 55vh;
  }

  header h1 {
    font-size: 22px;
  }

}

</style>

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

  }

).addTo(map);


/* Warstwa markerów */

const markerLayer =
  L.layerGroup().addTo(map);


/*
   Przechowujemy marker dla każdego wydarzenia.

   Dzięki temu kliknięcie karty na liście
   zawsze znajdzie właściwy marker.
*/

const eventMarkers = new Map();


/* =========================================================
   ELEMENTY
========================================================= */

const eventList =
  document.getElementById("eventList");

const summary =
  document.getElementById("summary");

const monthFilter =
  document.getElementById("monthFilter");

const provinceFilter =
  document.getElementById("provinceFilter");

const search =
  document.getElementById("search");

const showAll =
  document.getElementById("showAll");


/* =========================================================
   WOJEWÓDZTWA
========================================================= */

const provinces = [

  ...new Set(

    events.map(
      event => event.province
    )

  )

].sort(

  (a, b) =>
    a.localeCompare(b, "pl")

);


provinces.forEach(province => {

  const option =
    document.createElement("option");

  option.value = province;

  option.textContent =
    province.charAt(0).toUpperCase()
    + province.slice(1);

  provinceFilter.appendChild(option);

});


/* =========================================================
   FORMAT DATY
========================================================= */

function formatDate(dateString) {

  const date =
    new Date(
      dateString + "T12:00:00"
    );

  return date.toLocaleDateString(

    "pl-PL",

    {

      weekday: "long",

      day: "numeric",

      month: "long",

      year: "numeric"

    }

  );

}


/* =========================================================
   POBIERANIE PRZEFILTROWANYCH WYDARZEŃ
========================================================= */

function getFilteredEvents() {

  const month =
    monthFilter.value;

  const province =
    provinceFilter.value;

  const phrase =
    search.value
      .trim()
      .toLowerCase();


  return events

    .filter(event => {

      const monthOK =

        month === "all"
        ||
        event.date.startsWith(month);


      const provinceOK =

        province === "all"
        ||
        event.province === province;


      const searchOK =

        !phrase
        ||
        event.name
          .toLowerCase()
          .includes(phrase)
        ||
        event.city
          .toLowerCase()
          .includes(phrase)
        ||
        event.province
          .toLowerCase()
          .includes(phrase)
        ||
        event.distance
          .toLowerCase()
          .includes(phrase);


      return (

        monthOK
        &&
        provinceOK
        &&
        searchOK

      );

    })

    .sort(

      (a, b) =>
        a.date.localeCompare(b.date)

    );

}


/* =========================================================
   KLUCZ LOKALIZACJI
========================================================= */

/*
   Wydarzenia mające identyczne współrzędne
   traktujemy jako znajdujące się w tej samej lokalizacji.
*/

function locationKey(event) {

  return (

    `${event.lat.toFixed(5)},`
    +
    `${event.lng.toFixed(5)}`

  );

}


/* =========================================================
   TWORZENIE WŁASNEJ IKONY
========================================================= */

function createMarkerIcon(number, multiple) {

  if (!multiple) {

    return L.divIcon({

      className: "",

      html: `
        <div
          style="
            width:24px;
            height:24px;
            border-radius:50%;
            background:#16a085;
            border:3px solid white;
            box-shadow:0 2px 7px rgba(0,0,0,.35);
          "
        ></div>
      `,

      iconSize: [24, 24],

      iconAnchor: [12, 12],

      popupAnchor: [0, -12]

    });

  }


  return L.divIcon({

    className: "",

    html: `

      <div class="multi-marker">

        ${number}

      </div>

    `,

    iconSize: [34, 34],

    iconAnchor: [17, 17],

    popupAnchor: [0, -17]

  });

}


/* =========================================================
   WYLICZANIE POZYCJI MARKERA
========================================================= */

/*
   Jeżeli w jednym miejscu są np. 2 wydarzenia:

      ●       ●

   zamiast:

      ●
      ●

   Jeżeli jest ich więcej:

          ●

      ●       ●

          ●

   Dzięki temu żaden marker nie zasłania drugiego.
*/

function getMarkerPosition(event, index, count) {

  if (count <= 1) {

    return [
      event.lat,
      event.lng
    ];

  }


  /*
     Promień przesunięcia.

     0.0015 stopnia to około 150–170 metrów,
     więc markery są widoczne, ale nadal pozostają
     blisko właściwej lokalizacji.
  */

  const radius = 0.0015;


  /*
     Dla dwóch markerów ustawiamy je poziomo.
  */

  if (count === 2) {

    const positions = [

      [0, -radius],

      [0, radius]

    ];

    return [

      event.lat + positions[index][0],

      event.lng + positions[index][1]

    ];

  }


  /*
     Dla większej liczby markerów
     używamy okręgu.
  */

  const angle =

    (2 * Math.PI * index / count)
    -
    Math.PI / 2;


  return [

    event.lat
      +
      Math.sin(angle) * radius,

    event.lng
      +
      Math.cos(angle) * radius

  ];

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const filtered =
    getFilteredEvents();


  /*
     Czyścimy listę
  */

  eventList.innerHTML = "";


  /*
     Czyścimy markery
  */

  markerLayer.clearLayers();


  /*
     Czyścimy mapę markerów
  */

  eventMarkers.clear();


  /*
     Liczba wydarzeń
  */

  summary.innerHTML = `

    <strong>
      ${filtered.length}
    </strong>

    ${
      filtered.length === 1
        ? "wydarzenie"
        : "wydarzeń"
    }

    na mapie

  `;


  /*
     Brak wyników
  */

  if (!filtered.length) {

    eventList.innerHTML = `

      <div
        style="
          padding:25px;
          text-align:center;
          color:#68737a;
        "
      >

        Brak wydarzeń
        spełniających
        wybrane kryteria.

      </div>

    `;

    return;

  }


  /*
     Grupujemy wydarzenia
     według lokalizacji.
  */

  const groups = {};


  filtered.forEach(event => {

    const key =
      locationKey(event);


    if (!groups[key]) {

      groups[key] = [];

    }


    groups[key].push(event);

  });


  /*
     Lista wszystkich współrzędnych
     do dopasowania mapy.
  */

  const bounds = [];


  /* =======================================================
     RYSOWANIE
  ======================================================= */

  filtered.forEach(event => {

    const key =
      locationKey(event);

    const group =
      groups[key];

    const index =
      group.indexOf(event);

    const count =
      group.length;


    /*
       Obliczamy pozycję markera.
    */

    const position =
      getMarkerPosition(

        event,

        index,

        count

      );


    bounds.push(position);


    /* =====================================================
       KARTA
    ===================================================== */

    const card =
      document.createElement("article");


    card.className =
      "event";


    card.dataset.event =
      event.name
      + event.date
      + event.city;


    card.innerHTML = `

      <div class="event-date">

        ${formatDate(event.date)}

      </div>


      <div class="event-name">

        ${event.name}

      </div>


      <div class="event-location">

        📍 ${event.city}

        · ${event.province}

        · ${event.distance}

      </div>


      <div class="event-description">

        ${event.description}

      </div>


      <div class="badge">

        ✓ termin potwierdzony

      </div>

    `;


    eventList.appendChild(card);


    /* =====================================================
       MARKER
    ===================================================== */

    const marker =
      L.marker(

        position,

        {

          icon:
            createMarkerIcon(

              index + 1,

              count > 1

            )

        }

      );


    /*
       Popup
    */

    marker.bindPopup(`

      <div class="popup-title">

        ${event.name}

      </div>


      <div class="popup-date">

        ${formatDate(event.date)}

      </div>


      <div>

        📍 ${event.city}

        <br>

        🏃 ${event.distance}

      </div>


      <div class="popup-description">

        ${event.description}

      </div>

    `);


    marker.addTo(markerLayer);


    /*
       Zapamiętujemy marker.
    */

    eventMarkers.set(

      event,

      marker

    );


    /* =====================================================
       KLIKNIĘCIE KARTY
    ===================================================== */

    card.addEventListener(

      "click",

      () => {

        /*
           Usuwamy zaznaczenie
           z innych kart.
        */

        document

          .querySelectorAll(".event.active")

          .forEach(

            element =>
              element.classList.remove("active")

          );


        /*
           Zaznaczamy aktualną.
        */

        card.classList.add("active");


        /*
           Pobieramy właściwy marker.
        */

        const selectedMarker =
          eventMarkers.get(event);


        /*
           Przybliżamy mapę.
        */

        map.setView(

          position,

          Math.max(
            map.getZoom(),
            13
          ),

          {

            animate: true

          }

        );


        /*
           Otwieramy właściwy popup.
        */

        selectedMarker.openPopup();

      }

    );

  });


  /*
     Automatyczne dopasowanie mapy.
  */

  if (bounds.length === 1) {

    map.setView(

      bounds[0],

      12

    );

  }

}


/* =========================================================
   POKAŻ WSZYSTKIE
========================================================= */

showAll.addEventListener(

  "click",

  () => {

    monthFilter.value = "all";

    provinceFilter.value = "all";

    search.value = "";

    render();


    /*
       Wszystkie lokalizacje.
    */

    const allPositions =

      events.map(event => [

        event.lat,

        event.lng

      ]);


    if (allPositions.length) {

      map.fitBounds(

        allPositions,

        {

          padding: [40, 40]

        }

      );

    }

  }

);


/* =========================================================
   FILTRY
========================================================= */

monthFilter.addEventListener(

  "change",

  render

);


provinceFilter.addEventListener(

  "change",

  render

);


search.addEventListener(

  "input",

  render

);


/* =========================================================
   START
========================================================= */

render();


/*
   Mała poprawka po załadowaniu strony.
*/

setTimeout(

  () => {

    map.invalidateSize();

  },

  300

);

</script>

</body>
</html>
