<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendarz Biegowy Polska 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
    --blue: #173b72;
    --blue2: #2457a6;
    --green: #18a56b;
    --orange: #f28c28;
    --bg: #f3f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}
.header {
    background: linear-gradient(135deg, #102c59 0%, #2457a6 60%, #1b6fa8 100%);
    color: white;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.16);
    position: relative;
    z-index: 1000;
}
.logo-area {
    display: flex;
    align-items: center;
    gap: 13px;
}
.logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}
.header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.3px;
}
.header p {
    margin-top: 3px;
    font-size: 12px;
    opacity: .82;
}
.stats {
    display: flex;
    gap: 10px;
}
.stat {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    padding: 8px 12px;
    text-align: center;
}
.stat strong {
    display: block;
    font-size: 18px;
}
.stat span {
    font-size: 10px;
    opacity: .75;
}
.navigation {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    position: relative;
    z-index: 900;
}
.nav-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: #4b5563;
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: .2s;
}
.nav-btn:hover {
    border-color: var(--blue2);
    color: var(--blue2);
}
.nav-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}
.filters {
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    position: relative;
    z-index: 800;
}
.select, .search {
    height: 38px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 12px;
    color: var(--text);
    outline: none;
}
.select:focus, .search:focus {
    border-color: var(--blue2);
}
.search {
    width: 240px;
}
.filter-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
}
.main {
    display: flex;
    height: calc(100vh - 151px);
    min-height: 0;
}
.sidebar {
    width: 390px;
    min-width: 330px;
    background: white;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 700;
}
.sidebar-top {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.sidebar-title {
    font-size: 14px;
    font-weight: 800;
}
.counter {
    background: #eaf1ff;
    color: var(--blue2);
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
}
.events {
    overflow-y: auto;
    flex: 1;
}
.event {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: .18s;
}
.event:hover {
    background: #f7faff;
}
.event.selected {
    background: #edf5ff;
    border-left: 4px solid var(--blue2);
    padding-left: 12px;
}
.event-date {
    display: inline-block;
    background: var(--orange);
    color: white;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 800;
    margin-bottom: 5px;
}
.event-name {
    font-size: 13px;
    font-weight: 800;
    line-height: 1.3;
    color: #1f3f73;
}
.event-location {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
}
.event-footer {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.event-distance {
    font-size: 10px;
    color: #64748b;
}
.event-region {
    font-size: 9px;
    background: #eef2f7;
    color: #64748b;
    padding: 3px 6px;
    border-radius: 4px;
}
.map-wrapper {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
}
#map {
    width: 100%;
    height: 100%;
}
.map-info {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 500;
    background: rgba(255,255,255,.96);
    border-radius: 10px;
    padding: 9px 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    font-size: 10px;
}
.map-info strong {
    display: block;
    color: var(--blue);
    margin-bottom: 2px;
}
.popup-title {
    color: var(--blue);
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 6px;
}
.popup-date {
    display: inline-block;
    background: var(--orange);
    color: white;
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 800;
    margin-bottom: 7px;
}
.popup-info {
    font-size: 12px;
    line-height: 1.6;
    color: #4b5563;
    margin-bottom: 4px;
}
.empty {
    padding: 35px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
}
.empty-icon {
    font-size: 30px;
    margin-bottom: 8px;
}
@media (max-width: 800px) {
    body {
        height: auto;
        overflow: auto;
    }
    .header {
        padding: 13px 15px;
    }
    .header h1 {
        font-size: 17px;
    }
    .header p {
        display: none;
    }
    .stats {
        display: none;
    }
    .navigation {
        padding: 8px 10px;
    }
    .filters {
        padding: 8px 10px;
    }
    .search {
        width: 100%;
    }
    .main {
        height: auto;
        min-height: 800px;
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
        min-width: 0;
        height: 390px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }
    .map-wrapper {
        height: 55vh;
        min-height: 430px;
    }
}
</style>
</head>

</header>

    <button class="nav-btn" data-region="ŚLĄSKIE" onclick="setRegion('ŚLĄSKIE')">Śląskie</button>
    <button class="nav-btn" data-region="WIELKOPOLSKIE" onclick="setRegion('WIELKOPOLSKIE')">Wielkopolskie</button>
    <button class="nav-btn" data-region="OPOLSKIE" onclick="setRegion('OPOLSKIE')">Opolskie</button>
    <button class="nav-btn" data-region="PODKARPACKIE" onclick="setRegion('PODKARPACKIE')">Podkarpackie</button>
</nav>

<div class="filters">

        <option value="ŚLĄSKIE">Śląskie</option>
        <option value="WIELKOPOLSKIE">Wielkopolskie</option>
        <option value="OPOLSKIE">Opolskie</option>
        <option value="PODKARPACKIE">Podkarpackie</option>
        <option value="ŚWIĘTOKRZYSKIE">Świętokrzyskie</option>
        <option value="ŁÓDZKIE">Łódzkie</option>
    </select>

    <input id="search" class="search" type="search" placeholder="🔎 Szukaj biegu, miasta..." oninput="renderEvents()">
</div>

<div class="main">
    <aside class="sidebar">
        <div class="sidebar-top">

            <span id="counter" class="counter">0</span>

</div>

let markerLayer = L.layerGroup().addTo(map);

function formatDate(date) {
    const d = new Date(date + "T12:00:00");
    return d.toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit" });
}

function getMonth(date) {
    return date.split("-")[1];
}

function getFilteredEvents() {
    const month = document.getElementById("month").value;
    const province = document.getElementById("province").value;
    const search = document.getElementById("search").value.toLowerCase().trim();

    return events.filter(event => {
        const monthOK = getMonth(event.date) === month;
        let regionOK = currentRegion === "ALL" || event.region === currentRegion;
        if (province !== "ALL") {
            regionOK = event.region === province;
        }
        const searchOK = !search ||
            event.name.toLowerCase().includes(search) ||
            event.city.toLowerCase().includes(search) ||
            event.region.toLowerCase().includes(search);

        return monthOK && regionOK && searchOK;
    });
}

function renderEvents() {
    const container = document.getElementById("events");
    const filtered = getFilteredEvents();
    container.innerHTML = "";

    document.getElementById("counter").textContent = filtered.length;
    document.getElementById("stat-events").textContent = filtered.length;

    const cities = new Set(filtered.map(event => event.city));
    document.getElementById("stat-cities").textContent = cities.size;

    markerLayer.clearLayers();
    markers = [];

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔎</div>
                Nie znaleziono wydarzeń dla wybranych filtrów.
            </div>
        `;
        map.setView([52.0, 19.0], 6);
        return;
    }

    filtered.forEach((event, index) => {
        const item = document.createElement("div");
        item.className = "event";
        item.innerHTML = `
            <span class="event-date">${formatDate(event.date)}</span>
            <div class="event-name">${event.name}</div>
            <div class="event-location">📍 ${event.city}</div>
            <div class="event-footer">
                <span class="event-distance">🏃 ${event.distance}</span>
                <span class="event-region">${event.region}</span>
            </div>
        `;

        item.onclick = () => showEvent(event, index);
        container.appendChild(item);

        const marker = L.marker([event.lat, event.lng]);
        marker.bindPopup(`
            <div>
                <div class="popup-title">${event.name}</div>
                <div class="popup-date">${formatDate(event.date)}.2026</div>
                <div class="popup-info">
                    📍 ${event.city}<br>
                    🏃 ${event.distance}<br>
                    🗺️ ${event.region}
                </div>
            </div>
        `);

        marker.addTo(markerLayer);
        markers.push({ marker, item, event });
    });

    fitMap();
    setTimeout(() => map.invalidateSize(), 150);
}

function showEvent(event, index) {
    markers.forEach(object => object.item.classList.remove("selected"));
    markers[index].item.classList.add("selected");
    map.setView([event.lat, event.lng], 12, { animate: true });
    markers[index].marker.openPopup();
}

function fitMap() {
    if (markers.length === 0) return;
    const group = L.featureGroup(markers.map(object => object.marker));
    map.fitBounds(group.getBounds(), { padding: [45, 45], maxZoom: 8 });
}

function setRegion(region) {
    currentRegion = region;
    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.region === region);
    });
    document.getElementById("province").value = region;
    renderEvents();
}

function provinceChanged() {
    const value = document.getElementById("province").value;
    currentRegion = value;
    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.region === value);
    });
    renderEvents();
}

renderEvents();
setTimeout(() => map.invalidateSize(), 500);
</script>
</body>
</html>
