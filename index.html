<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalendarz Biegowy Polska 2026</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root {
    --bg: #f3f6fa;
    --card: #ffffff;
    --text: #172033;
    --muted: #6b7280;
    --accent: #e11d48;
    --accent-dark: #be123c;
    --border: #e2e8f0;
    --dark: #111827;
    --green: #15803d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */

header {
    background:
        linear-gradient(135deg, #111827, #1f2937);
    color: white;
    padding: 28px 24px;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
}

header h1 {
    margin: 0 0 7px;
    font-size: clamp(25px, 4vw, 38px);
}

header p {
    margin: 0;
    color: #cbd5e1;
    font-size: 15px;
}

/* TOOLBAR */

.toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid var(--border);

    padding: 14px 18px;

    display: grid;
    grid-template-columns:
        minmax(150px, .8fr)
        minmax(200px, 1fr)
        minmax(240px, 1.4fr)
        auto;

    gap: 10px;
}

.toolbar-inner {
    width: 100%;
}

select,
input,
button {
    width: 100%;
    border: 1px solid #d7dee8;
    border-radius: 11px;

    background: white;

    padding: 11px 13px;

    font-size: 14px;
    color: var(--text);
}

input:focus,
select:focus {
    outline: 2px solid rgba(225,29,72,.15);
    border-color: var(--accent);
}

button {
    cursor: pointer;
    font-weight: 700;
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    padding-left: 18px;
    padding-right: 18px;
}

button:hover {
    background: var(--accent-dark);
}

/* MAIN */

.layout {
    display: grid;
    grid-template-columns: 440px 1fr;
    min-height: calc(100vh - 145px);
}

.sidebar {
    background: #f8fafc;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    height: calc(100vh - 145px);
    padding: 15px;
}

#map {
    width: 100%;
    height: calc(100vh - 145px);
    min-height: 550px;
}

/* SUMMARY */

.summary {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 0 0 12px;
    padding: 4px 2px;

    font-size: 14px;
    font-weight: 800;
}

.summary-count {
    color: var(--accent);
}

/* EVENT CARD */

.event-card {
    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 14px;

    padding: 14px;
    margin-bottom: 10px;

    cursor: pointer;

    transition:
        transform .12s ease,
        box-shadow .12s ease,
        border-color .12s ease;
}

.event-card:hover {
    transform: translateY(-1px);
    border-color: #cbd5e1;
    box-shadow: 0 5px 18px rgba(15,23,42,.07);
}

.event-date {
    color: var(--accent);
    font-size: 13px;
    font-weight: 850;
}

.event-name {
    margin-top: 5px;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 800;
}

.event-location {
    margin-top: 7px;
    color: var(--muted);
    font-size: 13px;
}

.event-bottom {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 9px;
}

.badge {
    display: inline-block;

    background: #f1f5f9;
    color: #334155;

    padding: 4px 8px;
    border-radius: 999px;

    font-size: 11px;
    font-weight: 750;
}

.badge.province {
    background: #ecfdf5;
    color: var(--green);
}

/* POPUP */

.popup-title {
    font-size: 16px;
    font-weight: 850;
    margin-bottom: 6px;
}

.popup-line {
    font-size: 13px;
    margin: 3px 0;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px dashed #cbd5e1;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    color: var(--muted);
}

/* MOBILE */

@media (max-width: 1000px) {

    .toolbar {
        grid-template-columns: 1fr 1fr;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        height: auto;
        max-height: none;
        order: 2;
    }

    #map {
        order: 1;
        height: 55vh;
        min-height: 420px;
    }
}

@media (max-width: 600px) {

    header {
        padding: 22px 16px;
    }

    .toolbar {
        grid-template-columns: 1fr;
        position: static;
    }

    #map {
        height: 52vh;
    }
}
</style>
</head>

/* ======================================================
   MAPA
====================================================== */

const map = L.map("map", {
    zoomControl: true
}).setView([52.05, 19.25], 6);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
).addTo(map);


/* ======================================================
   FILTRY
====================================================== */

const monthFilter =
    document.getElementById("monthFilter");

const provinceFilter =
    document.getElementById("provinceFilter");

const searchInput =
    document.getElementById("searchInput");

const eventList =
    document.getElementById("eventList");

const eventCount =
    document.getElementById("eventCount");

const showAll =
    document.getElementById("showAll");


/* wszystkie województwa */

const provinces = [
    "dolnośląskie",
    "kujawsko-pomorskie",
    "lubelskie",
    "lubuskie",
    "łódzkie",
    "małopolskie",
    "mazowieckie",
    "opolskie",
    "podkarpackie",
    "podlaskie",
    "pomorskie",
    "śląskie",
    "świętokrzyskie",
    "warmińsko-mazurskie",
    "wielkopolskie",
    "zachodniopomorskie"
];

provinces.forEach(province => {

    const option =
        document.createElement("option");

    option.value = province;

    option.textContent =
        province.charAt(0).toUpperCase()
        + province.slice(1);

    provinceFilter.appendChild(option);
});


/* ======================================================
   MARKERY
====================================================== */

let markerLayer =
    L.layerGroup().addTo(map);

let markers = [];


/* ======================================================
   FORMAT DATY
====================================================== */

function formatDate(dateString) {

    const date =
        new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
        "pl-PL",
        {
            weekday: "short",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


/* ======================================================
   FILTROWANIE
====================================================== */

function getFilteredEvents() {

    const month =
        monthFilter.value;

    const province =
        provinceFilter.value;

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    return events
        .filter(event => {

            const monthOK =
                month === "all"
                || event.date.startsWith(month);

            const provinceOK =
                province === "all"
                || event.province === province;

            const text =
                (
                    event.name
                    + " "
                    + event.city
                    + " "
                    + event.province
                    + " "
                    + event.distance
                ).toLowerCase();

            const searchOK =
                !search
                || text.includes(search);

            return (
                monthOK
                && provinceOK
                && searchOK
            );
        })
        .sort((a,b) => {

            if (a.date !== b.date) {
                return a.date.localeCompare(b.date);
            }

            return a.city.localeCompare(
                b.city,
                "pl"
            );
        });
}


/* ======================================================
   RENDER
====================================================== */

function render() {

    const filtered =
        getFilteredEvents();


    /* wyczyść */

    markerLayer.clearLayers();

    markers = [];

    eventList.innerHTML = "";


    eventCount.textContent =
        filtered.length;


    if (filtered.length === 0) {

        eventList.innerHTML = `
            <div class="empty">
                <strong>Brak wydarzeń</strong>
                <br><br>
                Zmień miesiąc, województwo
                lub wyszukiwaną frazę.
            </div>
        `;

        return;
    }


    const bounds = [];


    filtered.forEach((event, index) => {

        /* marker */

        const marker =
            L.marker([
                event.lat,
                event.lng
            ]);


        marker.bindPopup(`
            <div class="popup-title">
                ${event.name}
            </div>

            <div class="popup-line">
                📅 ${formatDate(event.date)}
            </div>

            <div class="popup-line">
                📍 ${event.city}
            </div>

            <div class="popup-line">
                🏃 ${event.distance}
            </div>

            <div class="popup-line">
                🇵🇱 ${event.province}
            </div>
        `);


        marker.addTo(markerLayer);

        markers.push(marker);


        bounds.push([
            event.lat,
            event.lng
        ]);


        /* karta */

        const card =
            document.createElement("article");

        card.className =
            "event-card";


        card.innerHTML = `

            <div class="event-date">
                ${formatDate(event.date)}
            </div>

            <div class="event-name">
                ${event.name}
            </div>

            <div class="event-location">
                📍 ${event.city}
            </div>

            <div class="event-bottom">

                <span class="badge">
                    ${event.distance}
                </span>

                <span class="badge province">
                    ${event.province}
                </span>

            </div>
        `;


        card.addEventListener(
            "click",
            () => {

                map.setView(
                    [
                        event.lat,
                        event.lng
                    ],
                    13,
                    {
                        animate: true
                    }
                );

                marker.openPopup();

            }
        );


        eventList.appendChild(card);

    });


    /* dopasuj mapę */

    if (bounds.length === 1) {

        map.setView(
            bounds[0],
            13
        );

    } else {

        map.fitBounds(
            bounds,
            {
                padding: [
                    40,
                    40
                ],
                maxZoom: 10
            }
        );

    }
}


/* ======================================================
   EVENT LISTENERS
====================================================== */

monthFilter.addEventListener(
    "change",
    render
);

provinceFilter.addEventListener(
    "change",
    render
);

searchInput.addEventListener(
    "input",
    render
);

showAll.addEventListener(
    "click",
    () => {

        monthFilter.value = "all";
        provinceFilter.value = "all";
        searchInput.value = "";

        render();

    }
);


/* ======================================================
   START
====================================================== */

render();

</script>

</body>
</html>
